<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Vision</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}"
    />
  </head>
  <body>
    <div class="login-bg">
      <div class="gear-deco gear-1"><i class="fas fa-cog"></i></div>
      <div class="gear-deco gear-2"><i class="fas fa-cog"></i></div>
      <div class="gear-deco gear-3"><i class="fas fa-cog"></i></div>
    </div>

    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-header">
          <div class="login-icon">
            <i class="fas fa-cog fa-spin-slow"></i>
          </div>
          <h1>Sistema Vision</h1>
          <p>Tuercas &amp; Tornillos</p>
        </div>

        <div class="login-body">
          {% with messages = get_flashed_messages(with_categories=true) %} {% if
          messages %} {% for category, message in messages %}
          <div
            class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show"
            role="alert"
          >
            <i
              class="fas fa-{{ 'times-circle' if category == 'error' else 'info-circle' }} me-2"
            ></i
            >{{ message }}
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
            ></button>
          </div>
          {% endfor %} {% endif %} {% endwith %}

          <form method="POST" action="{{ url_for('login') }}" id="login-form">
            <div class="input-group-custom mb-4">
              <div class="input-icon">
                <i class="fas fa-user"></i>
              </div>
              <input
                type="text"
                name="username"
                id="username"
                class="form-input"
                placeholder="Usuario"
                required
                autocomplete="username"
              />
              <div class="input-line"></div>
            </div>

            <div class="input-group-custom mb-4">
              <div class="input-icon">
                <i class="fas fa-lock"></i>
              </div>
              <input
                type="password"
                name="password"
                id="password"
                class="form-input"
                placeholder="Contraseña"
                required
                autocomplete="current-password"
              />
              <button type="button" class="toggle-pass" id="toggle-pass">
                <i class="fas fa-eye" id="eye-icon"></i>
              </button>
              <div class="input-line"></div>
            </div>

            <button type="submit" class="btn-login" id="btn-login">
              <span class="btn-text">
                <i class="fas fa-sign-in-alt me-2"></i>INGRESAR
              </span>
              <span class="btn-loading" style="display: none">
                <i class="fas fa-spinner fa-spin me-2"></i>Verificando...
              </span>
            </button>
          </form>
        </div>

        <div class="login-footer">
          <p>
            <i class="fas fa-shield-alt me-1"></i> Acceso restringido al
            personal autorizado
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Toggle password visibility
      document
        .getElementById("toggle-pass")
        .addEventListener("click", function () {
          const input = document.getElementById("password");
          const icon = document.getElementById("eye-icon");
          if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("fa-eye", "fa-eye-slash");
          } else {
            input.type = "password";
            icon.classList.replace("fa-eye-slash", "fa-eye");
          }
        });

      // Loading state on submit
      document
        .getElementById("login-form")
        .addEventListener("submit", function () {
          document.querySelector(".btn-text").style.display = "none";
          document.querySelector(".btn-loading").style.display = "inline";
          document.getElementById("btn-login").disabled = true;
        });
    </script>
  </body>
</html>
